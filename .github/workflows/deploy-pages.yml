name: Deploy Mainframe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  visual-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check background video
        run: |
          VIDEO_URL="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
          curl -L --fail --retry 2 "$VIDEO_URL" -o aria.mp4
          ffprobe -v error -show_format -show_streams aria.mp4 > video-info.txt
          ffmpeg -y -ss 0 -i aria.mp4 -frames:v 1 video-first-frame.jpg

      - name: Capture published page
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --hide-scrollbars --window-size=1440,900 \
            --virtual-time-budget=5000 \
            --screenshot=mainframe.png \
            https://neotwalker.github.io/Check/

      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: mainframe-visual-check
          path: |
            mainframe.png
            video-first-frame.jpg
            video-info.txt
