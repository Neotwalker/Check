name: Deploy Mainframe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Sync compiled site into main
        run: |
          rm -rf assets
          cp dist/index.html index.html
          cp -R dist/assets ./assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync Pages build [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  visual-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Setup browser check
        run: npm install --no-save playwright-core

      - name: Verify published video scrub and capture page
        run: |
          cat > visual-check.mjs <<'EOF'
          import { chromium } from 'playwright-core'

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-gpu'],
          })
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } })

          await page.goto('https://neotwalker.github.io/Check/', {
            waitUntil: 'networkidle',
            timeout: 60000,
          })
          await page.waitForTimeout(1500)

          const before = await page.locator('video').evaluate((video) => ({
            currentTime: video.currentTime,
            readyState: video.readyState,
            width: video.videoWidth,
            height: video.videoHeight,
            error: video.error?.code ?? null,
          }))

          if (before.readyState < 2 || before.width === 0 || before.height === 0 || before.error) {
            throw new Error(`Video did not load correctly: ${JSON.stringify(before)}`)
          }

          await page.mouse.move(100, 450)
          await page.mouse.move(1100, 450, { steps: 12 })
          await page.waitForTimeout(1200)

          const after = await page.locator('video').evaluate((video) => ({
            currentTime: video.currentTime,
            readyState: video.readyState,
            error: video.error?.code ?? null,
          }))

          if (after.currentTime <= before.currentTime || after.error) {
            throw new Error(`Video scrub did not advance: before=${JSON.stringify(before)} after=${JSON.stringify(after)}`)
          }

          await page.screenshot({ path: 'mainframe.png', fullPage: true })
          await browser.close()
          EOF
          node visual-check.mjs

      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: mainframe-visual-check
          path: mainframe.png
