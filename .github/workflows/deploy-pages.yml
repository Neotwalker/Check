name: Deploy Mainframe to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  visual-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Setup browser diagnostics
        run: |
          npm install --no-save playwright-core
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Extract video poster
        run: |
          VIDEO_URL="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
          curl -L --fail "$VIDEO_URL" -o aria.mp4
          ffmpeg -y -ss 0.04 -i aria.mp4 -frames:v 1 -q:v 3 poster.jpg

      - name: Inspect published page
        run: |
          cat > visual-check.mjs <<'EOF'
          import { chromium } from 'playwright-core'

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-gpu'],
          })

          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
          })

          page.on('response', (response) => {
            if (response.url().includes('.mp4')) {
              console.log('VIDEO_RESPONSE', response.status(), response.url())
            }
          })

          page.on('requestfailed', (request) => {
            if (request.url().includes('.mp4')) {
              console.log('VIDEO_REQUEST_FAILED', request.failure()?.errorText, request.url())
            }
          })

          page.on('console', (message) => console.log('PAGE_CONSOLE', message.type(), message.text()))

          await page.goto('https://neotwalker.github.io/Check/', {
            waitUntil: 'networkidle',
            timeout: 60000,
          })

          await page.waitForTimeout(3000)

          const getVideoState = () =>
            page.locator('video').evaluate((video) => ({
              currentTime: video.currentTime,
              duration: video.duration,
              readyState: video.readyState,
              networkState: video.networkState,
              videoWidth: video.videoWidth,
              videoHeight: video.videoHeight,
              paused: video.paused,
              error: video.error
                ? {
                    code: video.error.code,
                    message: video.error.message,
                  }
                : null,
              currentSrc: video.currentSrc,
            }))

          console.log('VIDEO_STATE_BEFORE', JSON.stringify(await getVideoState()))

          await page.mouse.move(100, 450)
          await page.mouse.move(1100, 450, { steps: 12 })
          await page.waitForTimeout(2500)

          console.log('VIDEO_STATE_AFTER', JSON.stringify(await getVideoState()))

          await page.screenshot({ path: 'mainframe.png', fullPage: true })
          await browser.close()
          EOF

          node visual-check.mjs

      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: mainframe-visual-check
          path: |
            mainframe.png
            poster.jpg
